name: big-bear-write-freely
services:
  big-bear-write-freely:
    container_name: big-bear-write-freely
    image: nephatrine/write-freely:0.17@sha256:0ed358f09ac1aadaaefb6b72747c16b69487db11a932fc5b2bea58e5e0caa29f
    restart: unless-stopped
    environment:
      TZ: UTC
      PUID: 1000
      PGID: 1000
    volumes:
    - ${APP_DATA_DIR}/data/config:/mnt/config
    ports:
    - 70:70/tcp
    - 8080:8080/tcp
version: '3.7'
