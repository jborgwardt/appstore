name: big-bear-unifi-network-application-mongo-4
services:
  app:
    image: linuxserver/unifi-network-application:10.6.106@sha256:4d5fc889c2f2c2cecc6b35d4d641780cbedbe90d3a51b8f03283261b137af468
    container_name: big-bear-unifi-network-application
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - MONGO_HOST=big-bear-unifi-db
    - MONGO_USER=unifi
    - MONGO_PASS=unifi_password
    - MONGO_PORT=27017
    - MONGO_DBNAME=unifi
    - MEM_LIMIT=1024
    - MEM_STARTUP=1024
    - MONGO_TLS=
    - MONGO_AUTHSOURCE=
    volumes:
    - ${APP_DATA_DIR}/config:/config
    ports:
    - 8443:8443
    - 3478:3478/udp
    - 10001:10001/udp
    - 8080:8080
    - 1900:1900/udp
    - 8843:8843
    - 8880:8880
    - 6789:6789
    - 5514:5514/udp
    restart: unless-stopped
    networks:
    - unifi-nework-application-network
    depends_on:
    - unifi-db
  unifi-db:
    image: mongo:4.4.28@sha256:7a272834036ddc9c7379c2d646b6a6c23c985e28c280f1340b3f611c762f9d83
    container_name: big-bear-unifi-db
    volumes:
    - ${APP_DATA_DIR}/db/data:/data/db
    - /DATA/AppData/big-bear-unifi-network-application/db/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    ports:
    - 27017:27017
    networks:
    - unifi-nework-application-network
    restart: unless-stopped
networks:
  unifi-nework-application-network:
    driver: bridge
version: '3.7'
