version: '3.7'
services:
  app:
    image: drone/drone:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:80
    - 443:443
    environment:
    - DRONE_GITHUB_CLIENT_ID=
    - DRONE_GITHUB_CLIENT_SECRET=
    - DRONE_RPC_SECRET=
    - DRONE_SERVER_HOST=drone.example.com
    - DRONE_SERVER_PROTO=https
    volumes:
    - ${APP_DATA_DIR}/data/path1:/data
