name: big-bear-mailpit
services:
  app:
    image: axllent/mailpit:v1.31@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    container_name: mailpit
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data
    environment:
    - TZ=UTC
    ports:
    - 8025:8025
    - 1025:1025
version: '3.7'
