name: big-bear-adguard-home-host
services:
  big-bear-adguard-home-host:
    container_name: big-bear-adguard-home-host
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    volumes:
    - ${APP_DATA_DIR}/data/work:/opt/adguardhome/work
    - ${APP_DATA_DIR}/data/conf:/opt/adguardhome/conf
    restart: unless-stopped
    network_mode: host
version: '3.7'
