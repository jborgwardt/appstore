name: big-bear-adguard-home
services:
  app:
    container_name: adguard-home
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    deploy:
      resources:
        reservations:
          memory: 64M
    volumes:
    - ${APP_DATA_DIR}/data/work:/opt/adguardhome/work
    - ${APP_DATA_DIR}/data/conf:/opt/adguardhome/conf
    restart: unless-stopped
    ports:
    - 53:53/tcp
    - 53:53/udp
    - 8080:80
    networks:
    - adguard-home-network
networks:
  adguard-home-network:
    driver: bridge
version: '3.7'
