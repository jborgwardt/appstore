name: big-bear-fireshare
services:
  fireshare:
    image: shaneisrael/fireshare:1.9.0
    container_name: fireshare
    ports:
    - 8585:80
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - ${APP_DATA_DIR}/processed:/processed
    - ${APP_DATA_DIR}/videos:/videos
    - ${APP_DATA_DIR}/images:/images
    environment:
    - ADMIN_USERNAME=admin
    - ADMIN_PASSWORD=admin
    - MINUTES_BETWEEN_VIDEO_SCANS=5
    - THUMBNAIL_VIDEO_LOCATION=10
    - DOMAIN=
    - PUID=1000
    - PGID=1000
    - ENABLE_TRANSCODING=false
    - TRANSCODE_GPU=false
    restart: unless-stopped
    networks:
    - fireshare-network
networks:
  fireshare-network:
    driver: bridge
version: '3.7'
