name: big-bear-claude-code
services:
  claude:
    image: ghcr.io/worph/claude-code-container:1.0.28@sha256:a73863d23af0222037a0d51cef0c350bfd86825f693cc9bbf889a6484aad2f94
    container_name: claude-code-app
    restart: unless-stopped
    ports:
    - 20041:9090
    environment:
      ANTHROPIC_API_KEY: ''
      AUTH_PASSWORD: 9c93e0aa-ebe4-4737-b222-d6445c64da29
      MCP_ENABLED: 'true'
      CLAUDE_SESSION_TTL: '1800'
    entrypoint:
    - /bin/sh
    - -c
    - "if [ -z \"$$AUTH_PASSWORD\" ] || [ \"$$AUTH_PASSWORD\" = \"9c93e0aa-ebe4-4737-b222-d6445c64da29\" ]; then\n  echo \"Replace AUTH_PASSWORD before start. An empty value opens the API, and the catalog value is public. This container mounts the Docker socket.\" >&2\n  exit 1\nfi\nexec /init\n"
    volumes:
    - ${APP_DATA_DIR}/workspace:/home/claude/workspace
    - ${APP_DATA_DIR}/config:/home/claude/.claude
    - /var/run/docker.sock:/var/run/docker.sock
  caddy:
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    container_name: claude-code-caddy
    restart: unless-stopped
    depends_on:
    - claude
    ports:
    - 20040:8080
    networks:
      default:
        aliases:
        - claude-code
    configs:
    - source: caddyfile
      target: /etc/caddy/Caddyfile
configs:
  caddyfile:
    content: ":8080 {\n  handle /login* {\n    reverse_proxy claude:9090\n  }\n  handle /logout {\n    reverse_proxy claude:9090\n  }\n  handle {\n    forward_auth claude:9090 {\n      uri /auth\n      @unauthorized status 401\n      handle_response @unauthorized {\n        redir * /login\n      }\n    }\n    reverse_proxy claude:8080\n  }\n}\n"
version: '3.7'
