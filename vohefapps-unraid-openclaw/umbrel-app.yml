description: 'OpenClaw is a powerful AI assistant gateway that connects Claude and other LLMs to messaging platforms like Discord, Telegram, WhatsApp, and more. Features include file access, shell commands, web browsing, cron jobs, and a web-based Control UI. To access the Control UI, add your token to the URL: http://YOUR-IP:18789/?token=YOUR-GATEWAY-TOKEN For setup details and documentation, see: https://github.com/jdhill777/openclaw-unraid OpenClaw project and source: https://github.com/openclaw/openclaw Requires at least one LLM API key. Anthropic (Claude) is recommended, but many providers are supported. Optional Homebrew: Some skills require tools installed via brew/go. This is completely optional and at your own discretion. If needed, open OpenClaw''s container console and run: NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)" We recommend reviewing the install script at brew.sh before running. You can ignore the "Next
  steps" output - the template has already configured the PATH for you.'
