version: '3.7'
services:
  app:
    image: ghcr.io/google/cadvisor:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:8080
    volumes:
    - ${APP_DATA_DIR}/data/path1:/rootfs
    - ${APP_DATA_DIR}/data/path2:/var/run
    - ${APP_DATA_DIR}/data/path3:/sys
    - ${APP_DATA_DIR}/data/path4:/var/lib/docker/
