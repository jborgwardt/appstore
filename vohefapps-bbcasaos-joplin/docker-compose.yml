name: big-bear-joplin
services:
  big-bear-joplin:
    container_name: big-bear-joplin
    image: joplin/server:3.7.2@sha256:3f7b852959aac38da10e3a451823bf149cbae6e74d8258db5b6e6e7f0db50c26
    restart: unless-stopped
    environment:
    - APP_PORT=22300
    - APP_BASE_URL=http://localhost:22300
    - DB_CLIENT=pg
    - POSTGRES_PASSWORD=27a1d42a-a15d-43dd-903c-2a73538647fe
    - POSTGRES_USER=bigbear
    - POSTGRES_DATABASE=joplin
    - POSTGRES_PORT=5432
    - POSTGRES_HOST=big-bear-joplin-db
    - MAX_TIME_DRIFT=0
    ports:
    - 22300:22300
    networks:
    - big_bear_joplin_network
    depends_on:
    - big-bear-joplin-db
  big-bear-joplin-db:
    container_name: big-bear-joplin-db
    image: postgres:14.2@sha256:2c954f8c5d03da58f8b82645b783b56c1135df17e650b186b296fa1bb71f9cfd
    volumes:
    - ${APP_DATA_DIR}/postgresql/data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
    - POSTGRES_PASSWORD=27a1d42a-a15d-43dd-903c-2a73538647fe
    - POSTGRES_USER=bigbear
    - POSTGRES_DB=joplin
    networks:
    - big_bear_joplin_network
networks:
  big_bear_joplin_network:
    driver: bridge
version: '3.7'
