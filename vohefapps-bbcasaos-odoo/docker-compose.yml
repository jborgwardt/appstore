name: big-bear-odoo
services:
  big-bear-odoo:
    container_name: big-bear-odoo
    image: odoo:19@sha256:dd9013e669caaa23d26765dc55814655eaeecca7cfc2c265dbabae913bce22fd
    restart: unless-stopped
    user: root
    volumes:
    - ${APP_DATA_DIR}/data/etc:/etc/odoo
    - ${APP_DATA_DIR}/data/addons:/mnt/extra-addons
    ports:
    - 8069:8069
    environment:
    - HOST=big-bear-odoo-db
    - USER=odoo
    - PASSWORD=a8d785b6-bc00-49cc-8675-d404093d1507
    networks:
    - big_bear_odoo_network
  big-bear-odoo-db:
    container_name: big-bear-odoo-db
    image: postgres:15@sha256:bcab099bfaab33333a73a2ebe8c1d615c9f4c2402dd43452f989a36c6da9a5ba
    user: root
    environment:
    - POSTGRES_USER=odoo
    - POSTGRES_PASSWORD=a8d785b6-bc00-49cc-8675-d404093d1507
    - POSTGRES_DB=postgres
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/postgresql:/var/lib/postgresql/data
    networks:
    - big_bear_odoo_network
networks:
  big_bear_odoo_network:
    driver: bridge
version: '3.7'
