name: big-bear-komf
services:
  big-bear-komf:
    container_name: big-bear-komf
    image: sndxr/komf:2.1.0@sha256:373580779e2e75d4e00e2f05859f789e05691c54600ca83d1cb528f0aad1f7b6
    restart: unless-stopped
    environment:
    - KOMF_KOMGA_BASE_URI=http://komga:25600
    - KOMF_KOMGA_USER=admin@example.org
    - KOMF_KOMGA_PASSWORD=admin
    - KOMF_KAVITA_BASE_URI=http://kavita:5000
    - KOMF_KAVITA_API_KEY=cd1edcc1-6010-41a8-a82b-73f501dc2760
    - KOMF_LOG_LEVEL=INFO
    volumes:
    - ${APP_DATA_DIR}/config:/config
    user: 1000:1000
    ports:
    - 8085:8085
    networks:
    - big_bear_komf_network
networks:
  big_bear_komf_network:
    driver: bridge
version: '3.7'
