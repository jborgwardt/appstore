name: big-bear-traccar
services:
  app:
    image: traccar/traccar:6.16-ubuntu@sha256:fd903e34d41209a3890812cb868799dc893e71aee0cce3d51947ab6e44ace887
    container_name: traccar
    hostname: traccar
    restart: unless-stopped
    ports:
    - 8080:8082
    - 5000-5150:5000-5150
    - 5000-5150:5000-5150/udp
    volumes:
    - ${APP_DATA_DIR}/logs:/opt/traccar/logs:rw
    - ${APP_DATA_DIR}/traccar.xml:/opt/traccar/conf/traccar.xml:ro
version: '3.7'
