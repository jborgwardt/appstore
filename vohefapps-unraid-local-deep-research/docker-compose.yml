version: '3.7'
services:
  app:
    image: localdeepresearch/local-deep-research:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:5000
    environment:
    - LDR_WEB_HOST=0.0.0.0
    - LDR_WEB_PORT=5000
    - LDR_DATA_DIR=/data
    - LDR_LLM_OLLAMA_URL=http://ollama:11434
    - LDR_SEARCH_ENGINE_WEB_SEARXNG_DEFAULT_PARAMS_INSTANCE_URL=http://searxng:8080
    - LDR_LLM_PROVIDER=
    - LDR_LLM_MODEL=
    - LDR_LLM_OPENAI_API_KEY=
    - LDR_LLM_ANTHROPIC_API_KEY=
    - LDR_LLM_GOOGLE_API_KEY=
    - PUID=99
    - PGID=100
    volumes:
    - ${APP_DATA_DIR}/data/path1:/data
    - ${APP_DATA_DIR}/data/path2:/scripts
    - ${APP_DATA_DIR}/data/path3:/local_collections/personal_notes
    - ${APP_DATA_DIR}/data/path4:/local_collections/project_docs
    - ${APP_DATA_DIR}/data/path5:/local_collections/research_papers
