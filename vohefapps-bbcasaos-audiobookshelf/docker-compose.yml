name: big-bear-audiobookshelf
services:
  big-bear-audiobookshelf:
    container_name: big-bear-audiobookshelf
    image: ghcr.io/advplyr/audiobookshelf:2.34.0@sha256:4143292c530f6ac6700afd13360c04f477e4f1a81c1c97c4224b1c7e4330c5c4
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/media/data/books/spoken:/audiobooks
    - ${APP_DATA_DIR}/media/data/podcasts:/podcasts
    - ${APP_DATA_DIR}/data/config:/config
    - ${APP_DATA_DIR}/data/metadata:/metadata
    ports:
    - 8080:80
version: '3.7'
