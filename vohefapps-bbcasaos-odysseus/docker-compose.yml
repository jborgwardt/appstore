name: big-bear-odysseus
services:
  big-bear-odysseus:
    container_name: big-bear-odysseus
    image: bigbeartechworld/big-bear-odysseus:2026.10.12@sha256:bbefbd095094007f6bd662b794099349f44e5a047c4590a88eb9c7c96651ab9c
    restart: unless-stopped
    ports:
    - 7000:7000
    environment:
    - PUID=1000
    - PGID=1000
    - AUTH_ENABLED=true
    - ODYSSEUS_ADMIN_PASSWORD=61713bbc-7b62-4148-b5ea-5c83048c4818
    - SEARXNG_INSTANCE=http://searxng:8080
    - CHROMADB_HOST=chromadb
    - CHROMADB_PORT=8000
    volumes:
    - ${APP_DATA_DIR}/data:/app/data
    - ${APP_DATA_DIR}/logs:/app/logs
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:7000/api/health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - big_bear_odysseus_network
  chromadb:
    container_name: big-bear-odysseus-chromadb
    image: chromadb/chroma:1.5.9@sha256:1e0b73a187a28757c572acba508c46f48c9e8b0acaf5c20e6d95cdedce1acdf6
    restart: unless-stopped
    environment:
    - ANONYMIZED_TELEMETRY=FALSE
    volumes:
    - ${APP_DATA_DIR}/chromadb:/chroma/chroma
    networks:
    - big_bear_odysseus_network
  searxng:
    container_name: big-bear-odysseus-searxng
    image: searxng/searxng:2026.6.2-e964708c0@sha256:0872beb1d495d41f2dda73d7aea83746657afdd2be3010eb1b11f5a541555c9e
    restart: unless-stopped
    entrypoint:
    - /bin/sh
    - -c
    - "set -eu\nif [ ! -s /etc/searxng/settings.yml ]; then\n  secret=\"$${SEARXNG_SECRET:-}\"\n  if [ -z \"$$secret\" ]; then\n    secret=\"$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')\"\n  fi\n  cat > /etc/searxng/settings.yml <<EOF\nuse_default_settings: true\nserver:\n  secret_key: \"$$secret\"\nsearch:\n  formats:\n    - html\n    - json\nEOF\nfi\nexec /usr/local/searxng/entrypoint.sh\n"
    environment:
    - SEARXNG_BASE_URL=http://localhost:8080/
    - SEARXNG_SECRET=3164fa5e-b7bf-4c65-8576-c63170a47042
    volumes:
    - ${APP_DATA_DIR}/searxng:/etc/searxng
    cap_drop:
    - ALL
    cap_add:
    - CHOWN
    - SETGID
    - SETUID
    - DAC_OVERRIDE
    healthcheck:
      test:
      - CMD-SHELL
      - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=5).read(1)"
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 10s
    networks:
    - big_bear_odysseus_network
  ntfy:
    container_name: big-bear-odysseus-ntfy
    image: binwiederhier/ntfy:v2.31.0@sha256:803b2aaeb94df76c8b32ecd91039dc80b0fddb7041dcaf082b33bcdfd4ba39ad
    restart: unless-stopped
    command: serve
    ports:
    - 127.0.0.1:8091:80
    environment:
    - NTFY_BASE_URL=http://localhost:8091
    volumes:
    - ${APP_DATA_DIR}/ntfy:/var/cache/ntfy
    networks:
    - big_bear_odysseus_network
networks:
  big_bear_odysseus_network:
    driver: bridge
version: '3.7'
