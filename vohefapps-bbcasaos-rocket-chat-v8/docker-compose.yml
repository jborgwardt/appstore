name: big-bear-rocket-chat-v8
services:
  app:
    container_name: big-bear-rocket-chat-v8
    image: rocket.chat:8.9.0@sha256:2d3f9d4eda166dbb93d883f5194cbedbc145c8effd4c1bfa64ab4741bece0eca
    restart: unless-stopped
    environment:
      MONGO_OPLOG_URL: mongodb://db:27017/local
      ROOT_URL: http://localhost:3100
    ports:
    - 3100:3000
    depends_on:
      db:
        condition: service_healthy
    networks:
    - rocketchat-v8-net
  db:
    image: mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3
    container_name: big-bear-rocketchat-v8-db
    volumes:
    - ${APP_DATA_DIR}/db:/data/db
    healthcheck:
      test:
      - CMD
      - mongosh
      - --eval
      - db.adminCommand('ping')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
    - rocketchat-v8-net
networks:
  rocketchat-v8-net:
    driver: bridge
version: '3.7'
