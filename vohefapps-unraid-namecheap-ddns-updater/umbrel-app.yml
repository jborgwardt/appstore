description: 'This container automatically updates your Namecheap Dynamic DNS records for multiple hosts at a specified interval. At startup, the container generates a script located at /app/entrypoint.sh. You can manually edit this script inside the container for advanced customization. Before using this container: - Make sure you have an A record for @.yourdomain.com - Add CNAME records for each subdomain (e.g., admin.yourdomain.com) - Enable Dynamic DNS in your Namecheap dashboard and copy the API key Based on this tutorial: https://www.youtube.com/watch?v=9Wd2a_69QlW Original script by Daniel Boctor: https://github.com/daniel-boctor'
