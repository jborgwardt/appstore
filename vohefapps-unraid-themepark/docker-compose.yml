version: '3.7'
services:
  app:
    image: ghcr.io/themepark-dev/theme.park:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:80
    - 443:443
    environment:
    - TP_DOMAIN=
    - TP_SCHEME=
    - TP_URLBASE=
    - PUID=99
    - PGID=100
    volumes:
    - ${APP_DATA_DIR}/data/path1:/config
