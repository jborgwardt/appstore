name: big-bear-seerr
services:
  app:
    image: seerr/seerr:v3.5.0@sha256:27602401178d54f1964442287b9f23f67a3fa2252645ee8065839ea1c3f69e45
    init: true
    container_name: big-bear-seerr
    ports:
    - 5056:5055
    volumes:
    - ${APP_DATA_DIR}/config:/app/config
    environment:
    - LOG_LEVEL=debug
    - TZ=$TZ
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    network_mode: bridge
version: '3.7'
