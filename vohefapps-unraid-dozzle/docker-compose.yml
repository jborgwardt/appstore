version: '3.7'
services:
  app:
    image: amir20/dozzle:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:8080
    environment:
    - DOZZLE_BASE=/
    - DOZZLE_LEVEL=info
    - DOZZLE_TAILSIZE=300
    - DOZZLE_AUTH_PROVIDER=simple
    - DOZZLE_KEY=9Q9SJ69MZhZ0WrjbF
    - DOZZLE_NO_ANALYTICS=true
    volumes:
    - ${APP_DATA_DIR}/data/path1:/var/run/docker.sock
    - ${APP_DATA_DIR}/data/path2:/data
