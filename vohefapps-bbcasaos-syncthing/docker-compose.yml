name: big-bear-syncthing
services:
  big-bear-syncthing:
    container_name: big-bear-syncthing
    image: syncthing/syncthing:2.1@sha256:4d0281bdcb4ed9baf503d251d0544ddd856f49fce3f114056257ae172b7fb670
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/var/syncthing
    - ${APP_DATA_DIR}/media/data/syncthing:/media/data/syncthing
    ports:
    - 8384:8384
    - 22000:22000/tcp
    - 22000:22000/udp
    - 21027:21027/udp
    environment:
    - PUID=1000
    - PGID=1000
    stop_grace_period: 1m
version: '3.7'
