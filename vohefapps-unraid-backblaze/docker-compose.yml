version: '3.7'
services:
  app:
    image: tessypowder/backblaze-personal-wine:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:5800
    - 5900:5900
    environment:
    - SECURE_CONNECTION=0
    - TZ=Etc/UTC
    - DISPLAY_WIDTH=900
    - DISPLAY_HEIGHT=700
    - VNC_PASSWORD=
    - X11VNC_EXTRA_OPTS=
    - ENABLE_CJK_FONT=
    - FORCE_LATEST_UPDATE=false
    - USER_ID=99
    - GROUP_ID=100
    - CLEAN_TMP_DIR=1
    - DISABLE_AUTOUPDATE=false
    volumes:
    - ${APP_DATA_DIR}/data/path1:/drive_d/
    - ${APP_DATA_DIR}/data/path2:/config/
