version: '3.7'
services:
  app:
    image: vaultwarden/server:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:80
    environment:
    - SIGNUPS_ALLOWED=true|false
    - INVITATIONS_ALLOWED=true|false
    - WEBSOCKET_ENABLED=false
    - ADMIN_TOKEN=
    volumes:
    - ${APP_DATA_DIR}/data/path1:/data
