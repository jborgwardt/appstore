name: big-bear-farmos-v4
services:
  big-bear-farmos-v4:
    container_name: big-bear-farmos-v4
    image: farmos/farmos:4.0.8@sha256:0ead55792d93aaf9dc69d0e53e171a70163e4443d62df3bb7fb695c9487e3bc3
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/sites:/opt/drupal/web/sites
    ports:
    - 8083:80
    depends_on:
    - big-bear-farmos-v4-db
    networks:
    - big-bear-farmos-v4-network
  big-bear-farmos-v4-db:
    container_name: big-bear-farmos-v4-db
    image: mariadb:10.6@sha256:114d40be36852d0a019afd8458f7e1cc63fd300403b115b1f32e31130d5f671b
    volumes:
    - ${APP_DATA_DIR}/db:/var/lib/mysql
    ports:
    - 3307:3306
    environment:
      MYSQL_ROOT_PASSWORD: 037ed96f-5f27-4fa8-bd7f-49b4a804a05c
      MYSQL_DATABASE: big_bear_farmos
      MYSQL_USER: farmos
      MYSQL_PASSWORD: 037ed96f-5f27-4fa8-bd7f-49b4a804a05c
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      start_period: 1m
      start_interval: 10s
      interval: 1m
      timeout: 5s
      retries: 3
    networks:
    - big-bear-farmos-v4-network
networks:
  big-bear-farmos-v4-network:
    name: big-bear-farmos-v4-network
    driver: bridge
version: '3.7'
