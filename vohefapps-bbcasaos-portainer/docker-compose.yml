name: big-bear-portainer
services:
  app:
    container_name: big-bear-portainer
    image: portainer/portainer-ce:2.45.2-alpine@sha256:37aa2620d882794ed3e425b386db750f07500add53aa10adc741218b1e8d5782
    network_mode: bridge
    ports:
    - 8000:8000
    - 9000:9000
    - 9443:9443
    volumes:
    - ${APP_DATA_DIR}/data:/data
    - /var/run/docker.sock:/var/run/docker.sock
version: '3.7'
