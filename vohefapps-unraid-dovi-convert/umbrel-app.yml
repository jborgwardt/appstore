description: 'DoVi Convert provides a web interface for converting Dolby Vision Profile 7 MKV files (UHD Blu-ray rips) to Profile 8.1 for better compatibility with media players. Many devices cannot process Dolby Vision Profile 7 files, including Apple TV 4K (Plex/Infuse), Nvidia Shield, and Zidoo players. This causes fallback to HDR10 or playback issues. Features: - Web-based interface for easy operation - Scan directories for Dolby Vision files - Batch conversion with progress tracking - Safe mode for problematic files - Automatic backup creation - Real-time output streaming Based on the dovi_convert script by cryptochrome.'
