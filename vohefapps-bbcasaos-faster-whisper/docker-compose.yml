name: big-bear-faster-whisper
services:
  big-bear-faster-whisper:
    container_name: big-bear-faster-whisper
    image: linuxserver/faster-whisper:3.8.1@sha256:9b54e526cccc180c849df8672c7dc958c58e99188c9c589bfccacb57dda61c67
    restart: unless-stopped
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - WHISPER_MODEL=tiny-int8
    - WHISPER_BEAM=1
    - WHISPER_LANG=en
    volumes:
    - ${APP_DATA_DIR}/config:/config
    ports:
    - 10300:10300
version: '3.7'
