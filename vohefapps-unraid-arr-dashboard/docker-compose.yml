version: '3.7'
services:
  app:
    image: khak1s/arr-dashboard:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:3000
    environment:
    - PUID=99
    - PGID=100
    - DATABASE_URL=
    - BACKUP_PASSWORD=
    - SESSION_TTL_HOURS=24
    - WEBAUTHN_RP_NAME=Arr Dashboard
    - WEBAUTHN_RP_ID=
    - WEBAUTHN_ORIGIN=
    - API_RATE_LIMIT_MAX=200
    - GITHUB_TOKEN=
    volumes:
    - ${APP_DATA_DIR}/data/path1:/config
