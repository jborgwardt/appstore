name: big-bear-plex-nvidia
services:
  big-bear-plex-nvidia:
    container_name: big-bear-plex-nvidia
    image: linuxserver/plex:1.43.4@sha256:06e07af2851e6a822e89062b148435495dd794d6d5aaf36247dee05fb3dcc4b8
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - VERSION=docker
    - PLEX_CLAIM=
    - CPU_FALLBACK=true
    - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
    network_mode: host
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/tv:/tv
    - ${APP_DATA_DIR}/movies:/movies
    devices:
    - /dev/dri:/dev/dri
    - /dev/dvb:/dev/dvb
    deploy:
      resources:
        reservations:
          memory: 256M
          devices:
          - capabilities:
            - gpu
version: '3.7'
