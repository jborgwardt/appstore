name: big-bear-obsidian-livesync
services:
  app:
    container_name: obsidian-livesync
    image: couchdb:3.5.0@sha256:1c0a30a54535377bc9ae23f42efb1ca4e92abe796f78ec98b768ac1d5874cc1b
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data/couchdb:/opt/couchdb/data
    - ${APP_DATA_DIR}/data/local.ini:/opt/couchdb/etc/local.ini
    environment:
    - COUCHDB_USER=casaos
    - COUCHDB_PASSWORD=casaos
    ports:
    - 5984:5984
version: '3.7'
