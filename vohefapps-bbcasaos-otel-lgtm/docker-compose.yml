name: big-bear-otel-lgtm
services:
  big-bear-otel-lgtm:
    container_name: big-bear-otel-lgtm
    image: grafana/otel-lgtm:0.37.0@sha256:57b5ab1ca6619beb180174e2fccce04762470750669d043f544b4726d0582d07
    restart: unless-stopped
    volumes:
    - ${APP_DATA_DIR}/data:/data
    ports:
    - mode: ingress
      target: 3000
      published: '3000'
      protocol: tcp
    - mode: ingress
      target: 4317
      published: '4317'
      protocol: tcp
    - mode: ingress
      target: 4318
      published: '4318'
      protocol: tcp
    networks:
    - big-bear-otel-lgtm
networks:
  big-bear-otel-lgtm:
    driver: bridge
version: '3.7'
