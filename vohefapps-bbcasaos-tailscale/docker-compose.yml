name: big-bear-tailscale
services:
  big-bear-tailscale:
    container_name: big-bear-tailscale
    image: tailscale/tailscale:v1.104.1@sha256:87c55d6be56ad85b3d8bceca5f87f73de288c609131460dd1be1874c250cc41d
    restart: unless-stopped
    environment:
    - TS_SERVE_CONFIG=/config/serve-config.json
    - TS_ACCEPT_DNS=false
    - TS_AUTH_ONCE=false
    - TS_AUTHKEY=""
    - TS_HOSTNAME=""
    - TS_ROUTES=""
    - TS_EXTRA_ARGS=""
    - TS_USERSPACE=true
    - TS_STATE_DIR=/var/lib/tailscale
    volumes:
    - ${APP_DATA_DIR}/state:/var/lib/tailscale
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/shared:/shared
    - /dev/net/tun:/dev/net/tun
    cap_add:
    - net_admin
    - sys_module
version: '3.7'
