version: '3.7'
services:
  app:
    image: eafxx/rebuild-dndc:unraid-m
    restart: unless-stopped
    environment:
    - mastercontname=
    - mastercontconcheck=yes
    - ping_ip=1.1.1.1
    - ping_ip_alt=8.8.8.8
    - ping_count=4
    - sleep_secs=10
    - run_startup=yes|no
    - discord_notifications=no
    - discord_url=
    - cron=*/5 * * * *
    volumes:
    - ${APP_DATA_DIR}/data/path1:/var/run/docker.sock
    - ${APP_DATA_DIR}/data/path2:/config/docker-templates
    - ${APP_DATA_DIR}/data/path3:/config/rebuild-dndc
