version: '3.7'
services:
  app:
    image: syncarr/syncarr:latest
    restart: unless-stopped
    environment:
    - SYNC_INTERVAL_SECONDS=300
    - SYNCARR_BIDIRECTIONAL_SYNC=0
    - SYNCARR_AUTO_SEARCH=0
    - SYNCARR_MONITOR_NEW_CONTENT=0
    - RADARR_A_URL=
    - RADARR_A_KEY=
    - RADARR_B_URL=
    - RADARR_B_KEY=
    - RADARR_B_PROFILE=
    - RADARR_B_PATH=
    - SONARR_A_URL=
    - SONARR_A_KEY=
    - SONARR_B_URL=
    - SONARR_B_KEY=
    - SONARR_B_PROFILE=
    - SONARR_B_PATH=
    - LIDARR_A_URL=
    - LIDARR_A_KEY=
    - LIDARR_B_URL=
    - LIDARR_B_KEY=
    - LIDARR_B_PROFILE=
    - LIDARR_B_PATH=
