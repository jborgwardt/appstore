name: big-bear-ghost
services:
  app:
    container_name: big-bear-ghost
    image: ghost:6.71.0-alpine@sha256:8e07c5ec63d99e46b135998267eadf6f03e35249199fa29f937f015a350204d5
    restart: on-failure
    networks:
    - ghost-network
    environment:
      database__client: mysql
      database__connection__host: db
      database__connection__user: ghost
      database__connection__password: casaos
      database__connection__database: ghost
      url: http://localhost:2368
    volumes:
    - ${APP_DATA_DIR}/content:/var/lib/ghost/content
    ports:
    - 2368:2368
    depends_on:
    - db
  db:
    container_name: big-bear-ghost-db
    image: mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b
    restart: on-failure
    volumes:
    - ${APP_DATA_DIR}/mysql:/var/lib/mysql
    environment:
      MYSQL_USER: ghost
      MYSQL_DATABASE: ghost
      MYSQL_PASSWORD: casaos
      MYSQL_ROOT_PASSWORD: casaos
    networks:
    - ghost-network
networks:
  ghost-network:
    driver: bridge
version: '3.7'
