name: big-bear-ollama-amd
services:
  big-bear-ollama-amd:
    container_name: big-bear-ollama-amd
    image: ollama/ollama:0.40.5-rocm@sha256:af581cd7b471d1105f2b4056c100a1105db0894372a6135f2475fd419b6a901b
    restart: unless-stopped
    environment:
    - PORT=11434
    volumes:
    - ${APP_DATA_DIR}/.ollama:/root/.ollama
    ports:
    - 11434:11434
    devices:
    - /dev/kfd
    - /dev/dri
version: '3.7'
