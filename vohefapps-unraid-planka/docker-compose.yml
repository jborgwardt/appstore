version: '3.7'
services:
  app:
    image: ghcr.io/plankanban/planka:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:1337
    environment:
    - BASE_URL=http://localhost:3000
    - DATABASE_URL=postgresql://postgres@postgres/planka
    - SECRET_KEY=notsecretkey
    volumes:
    - ${APP_DATA_DIR}/data/path1:/app/public/user-avatars
    - ${APP_DATA_DIR}/data/path2:/app/public/project-background-images
    - ${APP_DATA_DIR}/data/path3:/app/private/attachments
