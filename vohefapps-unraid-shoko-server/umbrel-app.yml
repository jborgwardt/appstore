description: Shoko started as a small AniDB Mylist program to a full blown client-server architecture Have a large Anime Library? File management is a tedious process, so why not let Shoko handle that? Within FIVE minutes, you’ll have Shoko up and running and populating your collection database with information about the various series and episodes in your collection. For those looking for more advanced options, we offer a wide range of utilities in Shoko Desktop to configure your collection workflow to your liking. Please note, Shoko does not provide any way to download files, stream files from streaming sites or access files that are not part of your perosnal collection.
