version: '3.7'
services:
  app:
    image: bachya/ecowitt2mqtt:latest
    restart: unless-stopped
    ports:
    - $APP_PORT:8080
    environment:
    - ECOWITT2MQTT_MQTT_USERNAME=ecowitt
    - ECOWITT2MQTT_MQTT_PASSWORD=ecowitt
    - ECOWITT2MQTT_MQTT_BROKER=mqtt
    - ECOWITT2MQTT_MQTT_PORT=1883
    - ECOWITT2MQTT_HASS_DISCOVERY=true|false
    - ECOWITT2MQTT_OUTPUT_UNIT_SYSTEM=imperial|metric
    - ECOWITT2MQTT_VERBOSE=false|true
