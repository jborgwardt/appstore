name: big-bear-immich-aio-alpine
services:
  big-bear-immich-aio-alpine:
    container_name: big-bear-immich-aio-alpine
    image: ghcr.io/imagegenius/immich:3.2.2@sha256:cc08fbdcc1eef6e5fd5286667f70be63b8ab027cfac8710901f0b7a0f4c913de
    ports:
    - 2283:8080
    volumes:
    - ${APP_DATA_DIR}/config:/config
    - ${APP_DATA_DIR}/photos:/usr/src/app/photos
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    - DB_HOSTNAME=big-bear-immich-db
    - DB_USERNAME=casaos
    - DB_PASSWORD=casaos
    - DB_DATABASE_NAME=immich
    - REDIS_HOSTNAME=big-bear-immich-redis
    - DB_PORT=5432
    - REDIS_PORT=6379
    - REDIS_PASSWORD=
    - MACHINE_LEARNING_GPU_ACCELERATION=
    - MACHINE_LEARNING_WORKERS=1
    - MACHINE_LEARNING_WORKER_TIMEOUT=120
    depends_on:
    - big-bear-immich-redis
    - big-bear-immich-db
    restart: unless-stopped
    networks:
    - big_bear_immich_network
  big-bear-immich-redis:
    container_name: big-bear-immich-redis
    image: redis:6.2.20-alpine@sha256:2185e741f4c1e7b0ea9ca1e163a3767c4270a73086b6bbea2049a7203212fb7f
    restart: always
    networks:
    - big_bear_immich_network
  big-bear-immich-db:
    container_name: big-bear-immich-db
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: casaos
      POSTGRES_USER: casaos
      POSTGRES_DB: immich
      PG_DATA: /var/lib/postgresql/data
    volumes:
    - ${APP_DATA_DIR}/pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
    - big_bear_immich_network
networks:
  big_bear_immich_network:
    driver: bridge
version: '3.7'
