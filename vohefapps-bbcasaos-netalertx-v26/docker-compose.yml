name: big-bear-netalertx-v26
services:
  big-bear-netalertx-v26:
    container_name: big-bear-netalertx-v26
    image: jokobsk/netalertx:26.10.0@sha256:f95bca7a794141296dd1d16be5bb7f39f6fdbcd20353cdb51eee696e12d317f6
    restart: unless-stopped
    cap_drop:
    - ALL
    cap_add:
    - NET_RAW
    - NET_ADMIN
    - NET_BIND_SERVICE
    - CHOWN
    - SETUID
    - SETGID
    volumes:
    - ${APP_DATA_DIR}/config:/data/config
    - ${APP_DATA_DIR}/db:/data/db
    tmpfs:
    - /tmp
    environment:
    - TZ=UTC
    - PORT=8080
    - PUID=1000
    - PGID=1000
    - ALWAYS_FRESH_INSTALL=false
    network_mode: host
version: '3.7'
