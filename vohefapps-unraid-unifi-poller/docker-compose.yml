version: '3.7'
services:
  app:
    image: golift/unifi-poller:latest
    restart: unless-stopped
    environment:
    - UP_POLLER_DEBUG=false|true
    - UP_POLLER_QUIET=false|true
    - UP_UNIFI_CONTROLLER_0_URL=https://unraid.ip:8443
    - UP_UNIFI_CONTROLLER_0_USER=unifipoller
    - UP_UNIFI_CONTROLLER_0_PASS=
    - UP_UNIFI_CONTROLLER_0_SAVE_DPI=false|true
    - UP_UNIFI_CONTROLLER_0_SAVE_IDS=false|true
    - UP_UNIFI_CONTROLLER_0_SAVE_SITES=true|false
    - UP_UNIFI_CONTROLLER_0_SITES_0=all
    - UP_UNIFI_CONTROLLER_0_VERIFY_SSL=false|true
    - UP_INFLUXDB_URL=http://unraid.ip:8086
    - UP_INFLUXDB_USER=unifipoller
    - UP_INFLUXDB_PASS=
    - UP_INFLUXDB_DB=unifi
    - UP_INFLUXDB_INTERVAL=15s|30s|45s|1m|90s|2m|3m|4m|5m
    - UP_INFLUXDB_DISABLE=false|true
    - UP_PROMETHEUS_HTTP_LISTEN=0.0.0.0:9031
    - UP_PROMETHEUS_DISABLE=false|true
